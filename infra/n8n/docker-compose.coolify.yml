# =============================================================================
# n8n — motor de automação do projeto Chat
# =============================================================================
# Como usar no Coolify:
#   1. Project > + New Resource > Docker Compose (Empty)
#   2. Cole este arquivo
#   3. Coolify gera sozinho o FQDN e a senha do Postgres pelas variáveis
#      SERVICE_FQDN_* e SERVICE_PASSWORD_* abaixo
#   4. Defina N8N_ENCRYPTION_KEY nas env vars (veja .env.example)
#
# Postgres dedicado de propósito: mantém o n8n independente do ciclo de vida
# da stack do Supabase — um redeploy do Supabase no Coolify não derruba as
# automações.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.72.1
    restart: unless-stopped
    environment:
      # Coolify substitui isto pelo domínio e cria as labels do Traefik + SSL
      - SERVICE_FQDN_N8N_5678

      # --- Banco ---
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${SERVICE_USER_POSTGRES}
      - DB_POSTGRESDB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}

      # --- URLs públicas ---
      # Sem isto os webhooks são registrados com localhost e a Meta não alcança.
      - N8N_HOST=${SERVICE_URL_N8N_5678}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=${SERVICE_FQDN_N8N_5678}
      - N8N_EDITOR_BASE_URL=${SERVICE_FQDN_N8N_5678}
      - N8N_PROXY_HOPS=1

      # --- Segurança ---
      # Criptografa as credenciais salvas. PERDER ESTA CHAVE = perder todas
      # as credenciais dos workflows. Guarde num cofre.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY}
      - N8N_SECURE_COOKIE=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true

      # --- Comportamento ---
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_RUNNERS_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      # Poda execuções antigas: sem isso o banco cresce sem limite
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336          # 14 dias em horas
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all

      # --- Integração com o painel Chat ---
      # O n8n nunca fala direto com a Meta: ele chama a API do painel, que
      # centraliza envio, log e regra da janela de 24h.
      - CHAT_API_URL=${CHAT_API_URL}
      - CHAT_SERVICE_TOKEN=${CHAT_SERVICE_TOKEN}
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      n8n-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  n8n-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
    volumes:
      - n8n-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  n8n-data:
  n8n-db-data:
